site_name: Universal Honeypot Benchmarking Standard (UHBS)
site_description: Open-source evaluation framework for vendor-neutral honeypot and deception evaluation (UHQS 0–100, Safety Gate). Optional AEP and alpha SLM trial helper. Spec v4.5.1. Not a consortium standard.
site_url: https://uhbs.github.io/uhbs-standard/mkdocs/
repo_url: https://github.com/uhbs/uhbs-standard
repo_name: uhbs/uhbs-standard
edit_uri: edit/main/docs/
copyright: UHBS v4.5.1 — evaluation framework (Apache-2.0)

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  # MkDocs emits sitemap.xml under site_dir by default when using Material.

hooks:
  - hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/uhbs/uhbs-standard
      name: GitHub

