name: CI Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and tools
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev,lab]"
          pip install check-jsonschema

      - name: Lint
        run: |
          ruff check src/uhbs_cli src/uhbs_mcp src/uhbs_core/uhqs_math.py src/uhbs_core/models.py \
            src/uhbs_core/run_benchmark.py src/uhbs_core/hqs.py src/uhbs_core/manifest.py \
            src/uhbs_core/tps.py src/uhbs_core/report.py src/uhbs_core/inventory.py \
            src/uhbs_core/source_scan.py src/uhbs_core/ssh_session.py \
            src/uhbs_core/sandbox_preflight.py src/uhbs_core/calculate_uhqs_v4.py \
            src/uhbs_core/protocols tests

      - name: Unit tests
        run: pytest -q

      - name: Validate JSON schemas (meta)
        run: |
          check-jsonschema --check-metaschema schemas/profile.schema.json
          check-jsonschema --check-metaschema schemas/scorecard.schema.json

      - name: Validate example profile and scorecard
        run: |
          uhbs validate-profile templates/profile.yaml
          uhbs validate-profile templates/profiles/low-interaction.yaml
          uhbs validate-profile templates/profiles/ics-scada.yaml
          uhbs validate-scorecard docs/scorecards/examples/illustrative-posix-genai.scorecard.json
          uhbs validate-scorecard docs/conformance/fixtures/cowrie-low-interaction.scorecard.json --strict
          uhbs validate-scorecard docs/conformance/fixtures/cowrie-ssh.scorecard.json --strict
          uhbs validate-scorecard docs/conformance/fixtures/cowrie-telnet.scorecard.json --strict
          uhbs validate-scorecard docs/conformance/fixtures/posix-shell-lab.scorecard.json
          uhbs validate-scorecard docs/conformance/fixtures/safety-gate-fail.scorecard.json
          uhbs validate-scorecard docs/conformance/fixtures/espot-web-api.scorecard.json
          uhbs validate-scorecard docs/conformance/fixtures/miniprint-low-interaction.scorecard.json
          uhbs validate-scorecard docs/conformance/fixtures/conpot-ics-scada.scorecard.json --strict
          uhbs validate-scorecard docs/conformance/fixtures/opencanary-web-api.scorecard.json
          uhbs validate-scorecard docs/conformance/fixtures/endlessh-low-interaction.scorecard.json
          uhbs validate-scorecard docs/conformance/fixtures/honeywire-web-api.scorecard.json
          # framework_refs (D3FEND / Engage) worked example
          uhbs validate-scorecard docs/conformance/fixtures/hellpot-web-api.scorecard.json --strict
          for f in docs/conformance/fixtures/beelzebub-*.scorecard.json \
                   docs/conformance/fixtures/trapster-*.scorecard.json \
                   docs/conformance/fixtures/dionaea-*.scorecard.json; do
            uhbs validate-scorecard "$f" --strict
          done
          check-jsonschema --check-metaschema schemas/evidence-pack.schema.json
          python -c "import json; json.load(open('server.json'))"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Landing hub lockfile / install check
        working-directory: web
        run: npm ci --ignore-scripts

