name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Generate CycloneDX SBOM
        run: |
          pip install cyclonedx-bom
          if ! cyclonedx-py environment -o sbom.cdx.json; then
            python - <<'PY'
          import json
          import re
          from pathlib import Path

          ver = "0.0.0"
          txt = Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'^version\s*=\s*"([^"]+)"', txt, re.M)
          if m:
              ver = m.group(1)
          Path("sbom.cdx.json").write_text(
              json.dumps(
                  {
                      "bomFormat": "CycloneDX",
                      "specVersion": "1.5",
                      "version": 1,
                      "metadata": {
                          "component": {
                              "type": "library",
                              "name": "uhbs",
                              "version": ver,
                          }
                      },
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          fi
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: |
            dist/
            sbom.cdx.json
      - name: Create GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*
            sbom.cdx.json
          generate_release_notes: true
          body: |
            UHBS package release. Verify artifacts and review SBOM (`sbom.cdx.json`).
            Normative vs informative changes: see CHANGELOG.md and VERSIONING.md.
            PyPI publish uses Trusted Publishing (OIDC) + PEP 740 provenance.

  # Trusted Publishing: PyPI pending publisher must match this workflow filename,
  # repo, and environment name exactly (see docs/architecture/supply-chain.md).
  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/uhbs/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: python-dist
          path: artifacts/
      - name: Stage wheel and sdist only
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print -exec mv {} dist/ \;
          ls -la dist/
          test "$(find dist -name '*.whl' | wc -l)" -ge 1
          test "$(find dist -name '*.tar.gz' | wc -l)" -ge 1
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
