name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build landing site (UHBS hub)
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build specification docs (MkDocs → /mkdocs)
        run: |
          pip install mkdocs-material
          mkdocs build --strict --site-dir web/dist/mkdocs

      - name: Publish root discovery files
        run: |
          # AEO / GEO / SEO entrypoints advertised by AGENTS.md and humans.txt
          cp llms.txt web/dist/llms.txt
          cp docs/llms-full.txt web/dist/llms-full.txt
          cp docs/humans.txt web/dist/humans.txt
          cp server.json web/dist/server.json
          mkdir -p web/dist/.well-known web/dist/assets
          cp docs/.well-known/security.txt web/dist/.well-known/security.txt
          # Landing-page demo GIF (also symlinked from web/public/assets for Vite)
          cp docs/assets/uhbs-lab-demo.gif web/dist/assets/uhbs-lab-demo.gif
          # Root robots.txt — sitemap index covers landing + MkDocs tree
          printf '%s\n' \
            '# https://uhbs.github.io/uhbs-standard/robots.txt' \
            'User-agent: *' \
            'Allow: /' \
            '' \
            '# AEO / GEO: llms.txt · llms-full.txt · humans.txt · server.json (MCP)' \
            '# Prefer https://uhbs.github.io/uhbs-standard/llms.txt for agents' \
            '# Spec docs: /mkdocs/ · AEP: /mkdocs/advanced-evidence/' \
            '# AEP SLM alpha: /mkdocs/advanced-evidence/slm-alpha/' \
            'Sitemap: https://uhbs.github.io/uhbs-standard/sitemap.xml' \
            'Sitemap: https://uhbs.github.io/uhbs-standard/mkdocs/sitemap.xml' \
            'Host: https://uhbs.github.io/uhbs-standard/' \
            > web/dist/robots.txt
          # Ensure sitemap index + landing urlset are present (also via Vite public/)
          cp web/public/sitemap.xml web/dist/sitemap.xml
          cp web/public/sitemap-landing.xml web/dist/sitemap-landing.xml

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./web/dist
          # Required so /.well-known/security.txt is published (dotdirs are skipped by default).
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
