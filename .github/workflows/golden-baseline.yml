name: Golden Baseline (informational)

# Runs the live "plugin vs a REAL, non-honeypot reference daemon" checks in
# tests/test_plugin_baseline_live.py (see that file's module docstring for
# design/coverage — currently redis.py and smb.py only, via Docker).
#
# WHY continue-on-error: true — this workflow is intentionally NON-BLOCKING
# today. tests/test_plugin_baseline_live.py was added concurrently by
# another workstream in this same work session and has not yet been proven
# stable across multiple real CI runs (container startup flakiness, Docker
# availability on hosted runners, image pull timeouts, etc. are all
# unverified at this point). Marking this required before it has a track
# record would risk blocking unrelated PRs on infrastructure flakiness
# rather than real regressions.
#
# END STATE (not yet reached): once this workflow has been observed stable
# for a number of consecutive runs, flip `continue-on-error` to `false` (or
# remove it) so a plugin that regresses against a genuine reference daemon
# actually fails CI. See docs/architecture/ci-baseline.md for the honest
# today-vs-intended-end-state breakdown — this workflow does NOT enforce
# "100/100 or CI fails" yet.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-baseline:
    runs-on: ubuntu-latest
    # Informational only — see header comment. Do not treat a red check
    # here as a merge blocker until this comment (and the job name) change.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Confirm Docker is reachable (informational)
        run: docker version || echo "Docker not reachable — live baseline tests will self-skip"

      - name: Install package and tools
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev,lab]"

      - name: Run golden-baseline tests against real reference daemons
        env:
          RUN_LIVE_BASELINE: "1"
        run: pytest -q tests/test_plugin_baseline_live.py -v
