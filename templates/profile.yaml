# UHBS Target Profile Specification (TPS) — example
# Copy and adapt before evaluating a honeypot. All module weights,
# latency thresholds, and safety boundaries are derived from this profile.
# Vendor-neutral: use decoy class and protocol identifiers, not product brands.

uhbs_version: "4.5.2"

target_metadata:
  name: "Example POSIX Shell Decoy"
  class: "POSIX-Shell" # POSIX-Shell | ICS-SCADA | Web-API | Database | GenAI-Shell | Low-Interaction
  protocol: "ssh"
  description: "Interactive SSH decoy for enterprise deception benchmarking."
  version: "1.0.0"

performance_baseline:
  p95_latency_ms: 150
  strict_rfc_enforcement: true
  gold_baseline: "Native SSH service on a mainstream Linux distribution"

safety_boundary:
  air_gapped: true
  allowed_outbound: [] # deny-all except auditing egress gateway
  allow_local_code_execution: false
  notes: "No outbound Internet; DNS and ICMP blocked at sandbox edge."

# Profile-adaptive weights for POSIX / Interactive Shells (must sum to 1.00)
module_weights:
  w_A: 0.20 # Protocol Fidelity
  w_B: 0.25 # Behavioral Realism
  w_C: 0.20 # Telemetry Quality
  w_E: 0.15 # Scale & Latency
  w_F: 0.20 # Static Audit

telemetry:
  formats:
    - STIX-2.1
    - OpenTelemetry
  mitre_attack_mapping: true
