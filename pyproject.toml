[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uhbs"
dynamic = ["version"]
description = "Universal Honeypot Benchmarking Standard (UHBS) — validators and UHBS-Lab reference core"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Moran Zavdi" }]
keywords = [
  "honeypot",
  "benchmarking",
  "cybersecurity",
  "deception",
  "uhbs",
  "mcp",
  "model-context-protocol",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "jsonschema>=4.22",
  "PyYAML>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
lab = [
  "paramiko>=3.0",
]
mcp = [
  "mcp>=2,<3",
]
# Advanced Evidence Profile (AEP): offline statistical analysis only.
# Implemented with the stdlib + existing click/jsonschema/pyyaml deps — no
# networking, attack, agent, browser, cloud, container, or protocol-probing
# packages. The extra exists for discoverability (`pip install 'uhbs[aep]'`).
aep = []
# Alpha AEP Small Language Model evaluator (opt-in; disabled by default).
# No extra runtime deps — uses stdlib urllib for optional loopback-only
# openai_compatible provider after the user edits aep-slm.yaml unlock gates.
# Discoverability: pip install 'uhbs[aep-slm]' (or uhbs[aep]).
"aep-slm" = []
# Experimental offline matrix / provenance / genai-bench analysis (stdlib).
# Live GenAI/OT probes still require uhbs[lab]. Does not change UHQS.
experimental = []
# Discoverability alias for experimental GenAI/MCP offline analysis.
"genai-bench" = []
# Convenience meta-extra (still does not install attack runners into AEP).
all = [
  "paramiko>=3.0",
  "mcp>=2,<3",
  "scapy>=2.7,<3",
]
# Optional protocol-encoding backend (architecture review round 2, item 4):
# scapy has zero required transitive dependencies (verified against 2.7.0),
# so it's low-risk to offer, but it is NOT installed by default. snmp.py and
# modbus.py use it opportunistically when present and fall back to their
# existing hand-rolled BER/MBAP byte-building otherwise — mirrors the same
# "optional extra" pattern OpenCanary itself uses for its own SNMP module.
scapy = [
  "scapy>=2.7,<3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "paramiko>=3.0",
  "mcp>=2,<3",
]

[project.scripts]
uhbs = "uhbs_cli.cli:main"
uhbs-lab = "uhbs_core.run_benchmark:main"
uhbs-uhqs = "uhbs_core.calculate_uhqs_v4:main"
uhbs-mcp = "uhbs_mcp.server:main"

# Third-party protocol plugins register under the "uhbs.plugins" entry-point
# group in THEIR OWN package's pyproject.toml (not this one) — see
# docs/plugin-authoring.md and uhbs_core.protocols.registry.load_external_plugins().
# There are no first-party third-party plugins to register today, so this
# group intentionally has no real entries here — example shape only:
#
# [project.entry-points."uhbs.plugins"]
# coap = "my_uhbs_coap_plugin.plugin:CoAPPlugin"

[project.urls]
Homepage = "https://uhbs.github.io/uhbs-standard/"
Documentation = "https://uhbs.github.io/uhbs-standard/mkdocs/"
Repository = "https://github.com/uhbs/uhbs-standard"
Issues = "https://github.com/uhbs/uhbs-standard/issues"
Changelog = "https://github.com/uhbs/uhbs-standard/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "uhbs_core._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uhbs_core = [
  "profiles/tps/*.yaml",
  "profiles/*.yaml",
  "profiles/coverage/*",
]
uhbs_cli = [
  "schemas/*.json",
  "data/advanced-evidence/beginner/*",
  "data/advanced-evidence/advanced/*",
  "data/advanced-evidence/template/*",
  "data/advanced-evidence/slm/*",
  "data/experimental/matrix/beginner/*",
  "data/experimental/matrix/advanced/*",
  "data/experimental/matrix/template/*",
  "data/experimental/genai-mcp/beginner/*",
  "data/experimental/genai-mcp/advanced/*",
  "data/experimental/genai-mcp/template/*",
  "data/experimental/provenance/beginner/*",
  "data/experimental/provenance/advanced/*",
  "data/experimental/provenance/template/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Module A–F scripts retain lab-harness style; lint shared/core surfaces tightly.
extend-exclude = [
  "src/uhbs_core/test_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Lab harness protocol plugins retain long probe detail strings / socket patterns.
"src/uhbs_core/protocols/**/*.py" = ["E501", "SIM105"]
"src/uhbs_core/sandbox_preflight.py" = ["E402", "E501"]
"src/uhbs_core/test_*.py" = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Scoped, additive mypy config — see docs/architecture/supply-chain.md.
# Deliberately limited to the NEW modules added in the 2026-07-27 governance/
# packaging/DX review pass. Retrofitting `mypy --strict` across the existing
# 17-plugin codebase is out of scope here and is a separate, tracked effort
# (see ROADMAP.md) — do not widen `files` below without doing that work too.
[tool.mypy]
python_version = "3.11"
files = [
  "src/uhbs_core/contract_validation.py",
  "src/uhbs_core/plugin_sdk.py",
]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
