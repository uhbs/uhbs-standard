# Rerun runbook — unreachable-target units (results-5.0.1 wave)
#
# Consumed by:  python scripts/rerun_unit.py --runbook <this-file> --unit <unit_id>
# Coordinates (inventory/TPS/alias/port) come from the SQLite ledger;
# this file supplies the TARGET LAUNCHER (image, env, mounts, cmd).
#
# status values:
#   verified            — launcher confirmed against a live container
#   needs-launcher      — image known/likely; confirm env/mounts/cmd before trusting the grade
#   needs-config        — product config must enable the protocol (RERUN-TUTORIAL.md §6)
#   needs-investigation — no known launcher; triage with --preflight-only first
#
# TELEMETRY WIRING RULE (apply to every launcher):
#   All honeypots log somewhere by design. Set `log_path:` to the product's
#   native log directory INSIDE the container — rerun_unit.py mounts the graded
#   telemetry sink there (rw) so Module C can actually measure telemetry
#   (C1 parse/format, C2 injection markers, C4 ground truth). Products with
#   JSONL output get measured properly; text-only loggers will be measured-zero
#   (honest: their telemetry is not machine-consumable) — enable structured
#   logging where the product supports it.

