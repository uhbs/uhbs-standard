# Formal Low-Interaction SSH TPS for EchidraOSS deep UHBS-Lab grading.
target_metadata:
  name: "Low-Interaction-SSH-Telnet-Emulator"
  class: "Low-Interaction"
  protocol: "ssh"
  protocols: ["ssh"]

performance_baseline:
  expected_p95_latency_ms: 100
  strict_rfc_enforcement: true
  timing_samples: 1000

safety_boundary:
  allowed_outbound_traffic: false
  allow_local_code_execution: false
