# Quick TPS for ESPot — same class/protocol as full, fewer A3 samples (also capped by UHBS_QUICK).
target_metadata:
  name: "Web-API-Decoy"
  class: "Web-API"
  protocol: "http"
  protocols: ["http"]

performance_baseline:
  expected_p95_latency_ms: 150
  strict_rfc_enforcement: true
  timing_samples: 50

safety_boundary:
  allowed_outbound_traffic: false
  allow_local_code_execution: false
