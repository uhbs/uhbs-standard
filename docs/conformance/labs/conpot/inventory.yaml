# Inventory for mushorg/conpot detailed UHBS Docker lab (Modbus primary).
# Inside the uhbs-lab network, Conpot listens on container port 5020 (not host-mapped 502).
# Mounts: source → /honeypot, logs → /telemetry
sites:
  conpot:
    kind: generic
    class: ICS-SCADA
    host: conpot-lab
    protocol: modbus
    protocols: [modbus]
    port: 5020
    ports:
      modbus: 5020
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/conpot/ics_modbus_full.yaml
    container_image: conpot:lab-fixed

  conpot-bacnet:
    kind: generic
    class: ICS-SCADA
    host: conpot-lab
    protocol: bacnet
    protocols: [bacnet]
    port: 47808
    ports:
      bacnet: 47808
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/conpot/ics_scada_bacnet_full.yaml
    container_image: conpot:uhbs-lab

  conpot-http:
    kind: generic
    class: Web-API
    host: conpot-lab
    protocol: http
    protocols: [http]
    port: 80
    ports:
      http: 80
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/conpot/web_api_http_full.yaml
    container_image: conpot:uhbs-lab

  conpot-s7comm:
    kind: generic
    class: ICS-SCADA
    host: conpot-lab
    protocol: s7comm
    protocols: [s7comm]
    port: 102
    ports:
      s7comm: 102
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/conpot/ics_scada_s7comm_full.yaml
    container_image: conpot:uhbs-lab
