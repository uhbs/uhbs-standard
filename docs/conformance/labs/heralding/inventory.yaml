sites:
  heralding-ssh:
    kind: ssh
    class: Low-Interaction
    host: heralding-lab
    protocol: ssh
    protocols: [ssh]
    port: 22
    ports: {ssh: 22}
    user: root
    password: "admin"
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/heralding/low_interaction_ssh_full.yaml
    container_image: heralding:uhbs-lab
