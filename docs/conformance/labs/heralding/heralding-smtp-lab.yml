public_ip_as_destination_ip: false
bind_host: 0.0.0.0
activity_logging:
  file:
    enabled: true
    session_csv_log_file: "/telemetry/log_session.csv"
    session_json_log_file: "/telemetry/log_session.json"
    authentication_log_file: "/telemetry/log_auth.csv"
  syslog:
    enabled: false
  hpfeeds:
    enabled: false
    session_channel: "heralding.session"
    auth_channel: "heralding.auth"
    host:
    port: 20000
    ident:
    secret:
  curiosum:
    enabled: false
    port: 23400
hash_cracker:
  enabled: false
  wordlist_file: "wordlist.txt"
capabilities:
  smtp:
    enabled: true
    port: 25
    timeout: 30
    protocol_specific_data:
      banner: "Microsoft ESMTP MAIL service ready"
      fqdn: ""
  ftp:
    enabled: false
    port: 21
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "Microsoft FTP Server"
      syst_type: "Windows-NT"
  ssh:
    enabled: false
    port: 22
    timeout: 30
    protocol_specific_data:
      banner: "SSH-2.0-OpenSSH_6.6.1p1 Ubuntu-2ubuntu2.8"
  telnet:
    enabled: false
    port: 23
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
  pop3:
    enabled: false
    port: 110
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "+OK POP3 server ready"
  http:
    enabled: false
    port: 80
    timeout: 30
    protocol_specific_data:
      banner: ""
  mysql:
    enabled: false
    port: 3306
    timeout: 30
  postgresql:
    enabled: false
    port: 5432
    timeout: 30
  vnc:
    enabled: false
    port: 5900
    timeout: 30
  socks5:
    enabled: false
    port: 1080
    timeout: 30
  rdp:
    enabled: false
    port: 3389
    timeout: 30
    protocol_specific_data:
      banner: ""
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0
  imap:
    enabled: false
    port: 143
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "* OK IMAP4rev1 Server Ready"
  pop3s:
    enabled: false
    port: 995
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "+OK POP3 server ready"
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0
  imaps:
    enabled: false
    port: 993
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "* OK IMAP4rev1 Server Ready"
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0
  https:
    enabled: false
    port: 443
    timeout: 30
    protocol_specific_data:
      banner: ""
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0
  smtps:
    enabled: false
    port: 465
    timeout: 30
    protocol_specific_data:
      banner: "Microsoft ESMTP MAIL service ready"
      fqdn: ""
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0
