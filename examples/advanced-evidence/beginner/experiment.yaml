aep_version: 1.0.0
uhbs_version: 4.5.2
experiment_id: beginner-web-api
name: Beginner Web-API dwell comparison
hypothesis: Decoy sessions last longer than a matched reference under the same task.
primary_outcome: dtdr
secondary_outcomes:
- vod
- eer
- fsv
profile_class: Web-API
arms:
  decoy:
    name: synthetic-decoy
    version: 1.0.0
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  reference:
    name: synthetic-reference
    version: 1.0.0
    digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  evaluator_control:
    name: capability-check
    version: 1.0.0
    digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
attacker_capability_tier: scripted
task:
  description: Complete the declared recon/exploitation task.
  starting_knowledge: Shared starter brief for all arms.
  success_criteria: Task completion or timeout.
